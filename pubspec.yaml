name: radius
description: A proximity-based social connection app using Bluetooth LE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  dartz: ^0.10.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  crypto: ^3.0.3

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.6
  firebase_performance: ^0.10.0+10
  firebase_remote_config: ^5.4.0

  # Bluetooth
  flutter_blue_plus: ^1.31.13

  # Permissions
  permission_handler: ^11.1.0

  # Device Info
  device_info_plus: ^10.1.0

  # Image Loading
  cached_network_image: ^3.3.1
  
  # Image Handling
  image_picker: ^1.0.7
  http: ^1.2.0
  
  # URL Launcher
  url_launcher: ^6.2.4
  path_provider: ^2.1.5
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"  # Disables adaptive icons
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
