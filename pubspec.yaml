name: radius
description: A proximity-based social connection app using Bluetooth LE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1

  # Navigation
  go_router: ^17.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  dartz: ^0.10.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  crypto: ^3.0.3

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_database: ^12.1.2
  firebase_messaging: ^16.1.1
  firebase_storage: ^13.0.6
  google_sign_in: ^7.2.0
  firebase_crashlytics: ^5.0.7
  flutter_local_notifications: ^21.0.0
  firebase_app_check: ^0.4.1+4
  cloud_functions: ^6.0.6

  # Bluetooth
  flutter_blue_plus: ^2.1.0

  # Permissions
  permission_handler: ^12.0.1

  # Device Info
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0

  # Image Loading
  cached_network_image: ^3.3.1
  
  # Image Handling
  image_picker: ^1.0.7
  http: ^1.2.0
  file_picker: ^10.3.8
  record: ^6.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3
  
  # URL Launcher
  url_launcher: ^6.2.4
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  
  # Location & Maps
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  flutter_cache_manager: ^3.4.1

  wakelock_plus: ^1.2.8
  photo_view: ^0.15.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/locations.json

flutter_launcher_icons:
  android: "launcher_icon"  # Disables adaptive icons
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"